# Interface strings for the local app. One flat map per screen.
# The engine templates hold no user-facing text; if a string is missing
# here the English one shows and the app says the pack is incomplete.
language: en
native_reviewed: false

app:
  title: "Verbatim"
  local_notice: "Runs on this machine only, bound to 127.0.0.1. Nothing leaves."
  instance: "Instance"
  pack_incomplete: "This language pack is missing {count} interface strings, shown in English."

nav:
  overview: "Overview"
  profile: "Profile"
  ideas: "Ideas"
  posts: "Posts"
