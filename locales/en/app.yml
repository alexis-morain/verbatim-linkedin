  pillars: "Published posts per pillar"
  pillar: "Pillar"
  published: "published"
  no_published: "No published post yet. The counter runs over published posts only."
  recent: "Latest posts"

profile:
  title: "Profile"
  hint: "This is profile.md, verbatim. The file is the database; what you save here is what every skill reads."
  save: "Save profile.md"
  saved: "Saved."

ideas:
  title: "Idea bank"
  next_session: "Next session"
  used: "Used"
  used_date: "Date"
  used_pillar: "Pillar"
  used_angle: "Angle"
  used_file: "File"
  empty: "The bank is empty. A session never closes leaving it poorer than it found it."

posts:
  title: "Posts"
  date: "Date"
  state: "State"
  pillar: "Pillar"
  label: "Label"
  chars: "Chars"
  measured: "Measured"
  not_measured: "not yet"
  empty: "No post produced here yet."
  state_draft: "draft"
  state_scheduled: "scheduled"
  state_published: "published"

post:
  unreadable: "This post file is there and its bytes will not come back as text. It was saved in another encoding, or its permissions changed."
  measure_blocked: "The measurement cannot be written while the file does not read: writing it would replace what is in there with what could be parsed out of it."
  body: "The post, as the file holds it"
  measure: "Measurement, day 7"
  measure_hint: "Three numbers, none of them is a like. Empty means nobody looked yet, zero means it produced nothing."
  measured_on: "Measured on"
  inbound_connections: "Inbound connections from target profiles"
  inbound_dms: "DMs that mention a project or a mandate"
  meeting_mentions: "Times it came up in a call"
  note: "One line on what happened"
  save: "Save measurement"
  saved: "Measurement written to the post file."
  back: "All posts"

corpus:
  unreadable: "This corpus file is there and its bytes will not come back as text. Exports from other tools are often saved in another encoding; nothing here is guessed at, and nothing in corpus/ is ever rewritten."
  title: "Corpus"
  hint: "Posts published before this engine existed. Read, never rewritten."
  empty: "No corpus file."
  back: "All corpus files"

interview:
  title: "Interview"
  hint: "One question at a time, against the material already on this machine. Nothing gets written that you did not say."
  back: "All interviews"
  engine: "What would answer"
  provider: "Provider"
  model: "Model"
  endpoint: "Endpoint"
  unset: "not set"
  rate: "Rate"
  rate_value: "{input} in, {output} out, USD per million tokens"
  no_price: "No price for this model in this engine, so tokens are counted and no figure is invented."
  context: "Sent every turn"
  context_value: "{count} characters of skill and reference files, before a word of yours."
  tokens: "{input} tokens in, {output} out"
  spent: "{amount} USD"
  refused_secrets_in_instance: "This instance holds credentials, and an instance is a directory people copy, sync and sometimes commit. Move these lines to your shell environment and delete them here, comments included."
  refused_credential_in_endpoint: "The endpoint carries a credential in the URL itself. Put it in the process environment instead."
  refused_endpoint_in_clear: "The instance points the key at an endpoint that is not encrypted. A file that travels between machines does not get to downgrade the transport carrying a credential."
  refused_endpoint_untrusted: "The instance points the key at an endpoint that is neither the provider's own nor a runtime on this machine. Export VERBATIM_BASE_URL yourself, or name the host in VERBATIM_ENDPOINT_OK, next to the key it is allowed to receive."
  refused_interviews_not_a_directory: "The interviews entry of this instance is not a directory, or cannot be created. An interview id addresses a directory inside the instance, and following a link out of one is how a discard leaves it."
  refused_env_unreadable: "The .env of this instance cannot be read. It was saved in another encoding, or its permissions changed. Nothing here is guessed at: fix the file, then reload this screen."
  refused_engine_refused: "The engine configuration for this instance was refused."
  bundle_broken: "A skill cites a file that is not in this bundle, so no step can be assembled. This is a bundle to repair, not a setting to change."
  error_bundle_broken: "A skill cites a file that is not in this bundle, so no step can be assembled. This is a bundle to repair, not a setting to change."
  error_engine_failed: "The turn stopped on a failure inside the engine."
  error_unknown: "The turn was refused, and this engine does not have a name for the reason."
  problem_provider_unknown: "Unknown provider: {detail}. This engine speaks two wires, anthropic for the native one and openai for anything speaking the OpenAI chat format, local inference included."
  problem_model_missing: "No model id. Set VERBATIM_MODEL, spelled exactly as the provider spells it."
  problem_endpoint_missing: "No endpoint. Set VERBATIM_BASE_URL, or pick a provider that has a default."
  problem_key_missing: "No API key in this process. Export ANTHROPIC_API_KEY, OPENAI_API_KEY or VERBATIM_API_KEY, next to the endpoint it is allowed to reach. An instance never holds a key."
  not_ready: "No model is configured, so no interview can start. Every other screen works."
  start: "Start an interview"
  open: "Interviews"
  no_open: "No interview yet."
  not_started: "nothing said yet"
  turns: "answers: {count}"
  unreadable: "the conversation file does not parse; the words are in transcript.md next to it"
  state_open: "open"
  state_closed: "closed"
  closed_notice: "This interview became {post}. It is kept as it was."
  awaiting: "The last thing you said never got its answer. The browser was closed, or the turn failed. Nothing is lost: ask for the reply again, or add to what you said and send."
  resume: "Ask for the reply again"
  your_turn: "Your answer"
  send: "Send"
  needs_js: "This screen streams an answer as it is written, which needs JavaScript. Every other screen works without it."
  bank: "The angle bank"
  bank_hint: "Your own lines, out of ideas.md. Clicking one puts it in the box; edit it before sending."
  ending: "Ending this interview"
  discard: "Discard this interview"
  discard_hint: "Removes interviews/{path} and everything in it. What you said goes with it."
  said: "You"
  asked: "Verbatim"
  thinking: "Waiting for the model."
  tool_call: "reads"
  tool_result: "answered"
  tool_failed: "refused"
  stop_truncated: "The stream stopped without the provider saying why. That is a cut answer, not the end of a turn."
  stop_max_tokens: "The reply hit its token ceiling. Ask again for the rest."
  stop_refusal: "The provider refused to answer. That is its own guardrail, not this engine's."
  stop_other: "The provider stopped for a reason this engine does not have a name for."
  stop_tool_use: "The provider stopped asking for a tool without the answer arriving."
  stop_unknown: "The provider stopped and gave the reason as {code}."
  sheet: "The validation sheet"
  sheet_hint: "Nothing is drafted until this sheet is approved. Every line of it must come from the interview, the profile or the corpus; approving it is saying that they do."
  sheet_angle: "Angle"
  sheet_elements: "Concrete elements"
  sheet_moment: "The strong moment"
  sheet_conviction: "Central conviction"
  sheet_first_lines: "First line"
  sheet_approve: "Approve this sheet"
  sheet_approve_hint: "Approving closes the questions. If something on it is wrong, do not approve: say what is wrong in the box, and the next proposal replaces this sheet."
  sheet_changed: "The sheet changed after this screen was drawn, so nothing was approved. What is below is the sheet as it stands now; read it again before deciding."
  sheet_approved_notice: "The sheet is approved. The interview asks no more questions, and the draft is written from what is here."
  sheet_closed_notice: "The sheet is approved, so the interview asks no more questions. Drafting is the next step."
  error_sheet_approved: "The sheet is approved, so the interview asks no more questions. Drafting is the next step."
  error_turn_running: "This interview already has a turn running. Wait for it, or reload the page."
  error_closed: "This interview is closed. It became a post, and what was said then is kept as it was."
  error_not_configured: "No model is configured any more. Check the interview screen."
  error_nothing_to_send: "There is nothing to send yet."
  error_gone: "This interview is not on disk any more."
  ceiling: "Stopped after {count} turns without an answer. The conversation is kept, nothing is lost."
  error: "The provider did not answer:"
