# Interface strings for the local app. One flat map per screen.
# The engine templates hold no user-facing text; if a string is missing
# here the English one shows and the app says the pack is incomplete.
language: en
native_reviewed: false

app:
  title: "Verbatim"
  local_notice: "Runs on this machine only, bound to 127.0.0.1. Nothing leaves."
  instance: "Instance"
  pack_incomplete: "This language pack is missing {count} interface strings, shown in English."

nav:
  overview: "Overview"
  profile: "Profile"
  voice: "Voice"
  pillars: "Pillars"
  page: "LinkedIn page"
  ideas: "Ideas"
  interview: "Interview"
  posts: "Posts"
  corpus: "Corpus"

gaps:
  heading: "This instance does not pass conformance"
  profile-missing: "profile.md is missing. Run linkedin-setup before anything else."
  status-unparsed: "The Status block of profile.md does not parse."
  not-filled: "The profile says filled: no. No consumer pretends to know the person; run linkedin-setup."
  signature-missing: "The Signature block section is absent. That means an incomplete migration, not an empty signature."
  file-missing: "Missing companion file: {detail}"
  post-unreadable: "A post file cannot be read; its front matter is not valid: {detail}"
  profile-unreadable: "profile.md is there and cannot be read. It was saved in another encoding, or its permissions changed."
  post-keys-missing: "A post file is missing measurement keys: {detail}"

overview:
  title: "Overview"
  status: "Status"
  filled: "filled"
  "yes": "yes"
  "no": "no"
  updated: "updated"
  source: "source"
  languages: "languages"
  next_session: "Next session"
  no_next_session: "The idea bank does not name a next session. That line decides whether there is a next post."
  pillars: "Published posts per pillar"
  pillar: "Pillar"
  published: "published"
  no_published: "No published post yet. The counter runs over published posts only."
  recent: "Latest posts"

copy:
  markdown: "Copy the markdown"
  text: "Copy as plain text"
  post: "Copy the post, ready to paste"
  done: "Copied"
  failed: "Not copied"
  failed_hint: "The browser refused the clipboard, so nothing was copied. That is usually a window that does not have focus. The text is on this screen: select it and copy it by hand."

document:
  raw: "The file itself"

profile:
  title: "Profile"
  raw: "profile.md itself"
  hint: "One section at a time. The file is the database, and what you save here is what every skill reads."
  save: "Save profile.md"
  saved: "Saved."
  missing: "profile.md is not in this instance. Run linkedin-setup; nothing here invents one."
  unreadable: "This file is there and its bytes will not come back as text. It was saved in another encoding, or its permissions changed. Nothing is guessed and nothing is written over it."
  status: "Status"
  status_hint: "updated moves on its own whenever a section of this file is saved. filled and source are not edited here: the first is you saying the profile is real, the second says which road it came down, and neither follows from rewriting a paragraph."
  interface_language: "Language you are interviewed in"
  output_language_default: "Language posts are written in by default"
  status_save: "Save the Status block"
  bad_language: "That is not a language code, and nothing was written. It names a directory under locales/, so it is two or three letters, optionally a region: en, fr, pt-BR."
  section_edit: "Edit this section"
  section_save: "Save this section"
  section_changed: "This section changed between the moment this screen was drawn and your save, so nothing was written. What is above is the section as it stands now: read it again before saving over it."
  unvalidated: "unvalidated"
  unvalidated_hint: "Empty, or still carrying the template's angle brackets. No skill quotes a section in this state."
  duplicate: "Two sections carry this heading, so nothing can address one of them rather than the other. Rename one in the whole file below, then edit them here."
  whole_file: "The whole file"
  section_save_whole: "Save the whole file"

voice:
  title: "Voice"
  hint: "Style traits, each one followed by the quote it was read from. A trait without a quote is a guess and does not belong in the file. Editing here does not touch the provisional banner: that comes off after a rewrite on five to ten published posts, not before."
  missing: "voice.md is not in this instance. That is a migration gap to repair, not a file to do without."

pillars:
  title: "Pillars"
  missing: "pillars.md is not in this instance. That is a migration gap to repair, not a file to do without."

page:
  title: "LinkedIn page"
  hint: "Your public page as it was actually applied, written by linkedin-profile and read here. Nothing on this screen changes it."
  missing: "No linkedin-page.md yet. It appears the first time linkedin-profile applies something, so the next run can diff against the page instead of asking you to paste it again."

ideas:
  title: "Idea bank"
  next_session: "Next session"
  used: "Used"
  used_date: "Date"
  used_pillar: "Pillar"
  used_angle: "Angle"
  used_file: "File"
  empty: "The bank is empty. A session never closes leaving it poorer than it found it."
  add: "Add an angle"
  section: "Pillar section"
  pillar: "Pillar"
  label: "Funnel label"
  text: "The angle as a position, and the material that already exists for it"
  add_do: "Add to the bank"
  edit: "Edit this angle"
  edit_do: "Save this angle"
  remove: "Remove"
  write_this: "Write this one"
  bad_angle: "Nothing was written. An angle is one line: a pillar from 1 to 3, one of the three labels, and text carrying no pipe, which is the separator of the used line."
  angle_gone: "That angle is not in the bank any more. Reload this screen and pick again."

posts:
  title: "Posts"
  date: "Date"
  state: "State"
  pillar: "Pillar"
  label: "Label"
  chars: "Chars"
  measured: "Measured"
  not_measured: "not yet"
  empty: "No post produced here yet."
  state_draft: "draft"
  state_scheduled: "scheduled"
  state_published: "published"

post:
  unreadable: "This post file is there and its bytes will not come back as text. It was saved in another encoding, or its permissions changed."
  measure_blocked: "The measurement cannot be written while the file does not read: writing it would replace what is in there with what could be parsed out of it."
  body: "The post"
  body_hint: "Shown as text, never as markdown, because LinkedIn has no markdown and this is the screen where you decide to publish. What is here is what the copy button copies and what a publishing tier receives, to the byte."
  notes: "What the session left beside the post"
  notes_hint: "Under the seam in the same file, and never published with it: the sheet, every anchor the engine claimed and the interview sentence behind each one."
  measure: "Measurement, day 7"
  measure_hint: "Three numbers, none of them is a like. Empty means nobody looked yet, zero means it produced nothing."
  measured_on: "Measured on"
  inbound_connections: "Inbound connections from target profiles"
  inbound_dms: "DMs that mention a project or a mandate"
  meeting_mentions: "Times it came up in a call"
  note: "One line on what happened"
  save: "Save measurement"
  saved: "Measurement written to the post file."
  back: "All posts"
  publish: "Publishing"
  publish_hint: "Nothing leaves this machine until you have read a plan and confirmed it. The line to read on the plan is the target: a personal profile and a company page are two lines in a config file and two very different things in a feed."
  publish_when: "Schedule for"
  publish_when_hint: "Empty publishes now. Only a tier that schedules does anything with a time, and a time with no offset is read in whatever clock that tier keeps: write 2026-09-01T07:30+02:00 if you want to say which one."
  publish_ask: "Show what this would do"
  plan: "The plan"
  plan_hint: "Printed by lib/publish.py itself, in English, because these are the engine's own words rather than anything about your post. Read the target line, and the disclosure line if there is one, before confirming."
  publish_do: "Publish, for real"
  publish_do_hint: "This confirms the plan above, that one and no other. If the channel, the time or the post moved since it was drawn, the click sends nothing and shows you what moved."
  plan_changed: "The plan changed between the moment it was drawn and your click, so nothing was sent. What is below is the plan as it stands now: read the target again before confirming."
  publish_refused: "Nothing was sent. The words below are the script's own, in English, because this is the engine or your own tier failing rather than a finding about your post."
  publish_unfinished: "Something reached your publishing tier and then failed, or was killed for taking too long. Nothing here knows what it had already done, so this post may be out: check the channel before you try again, rather than sending a second one. The words below are the engine's own."
  publish_running: "A send is already running for this post. Wait for it, or reload this page: two of them would be two posts."
  publish_spent: "This plan was already confirmed, so nothing was sent. That is a reloaded page, or a second click on a button that was already pressed. Every plan is good for one confirm: draw it again, read the target again, and that one will send."
  publish_bad_when: "That is not a time. A scheduled time looks like 2026-09-01T07:30, and this one reached no tier."
  publish_sent: "The tier took it, and what it gave back is below. That is the tier's own answer, not a claim that anything is live."
  publish_state_next: "Nothing above touched the state of this post. Publishing and saying a post is published are two different facts, and only you hold the second one."
  state: "State and reference"
  state_hint: "Where this post is in its life, as you state it. Every count in this system runs over published posts alone, so this line is what makes it counted."
  state_ref: "Reference in whatever published it"
  state_ref_hint: "The post's URL, or the id the scheduling tool gave it. Empty until something did."
  state_save: "Save state"
  state_bad: "That is not one of the three states in references/measure.md, so nothing was written."

corpus:
  unreadable: "This corpus file is there and its bytes will not come back as text. Exports from other tools are often saved in another encoding; nothing here is guessed at, and nothing in corpus/ is ever rewritten."
  title: "Corpus"
  hint: "Posts published before this engine existed. Read, never rewritten."
  empty: "No corpus file."
  back: "All corpus files"

interview:
  title: "Interview"
  hint: "One question at a time, against the material already on this machine. Nothing gets written that you did not say."
  back: "All interviews"
  engine: "What would answer"
  provider: "Provider"
  model: "Model"
  endpoint: "Endpoint"
  unset: "not set"
  rate: "Rate"
  rate_value: "{input} in, {output} out, USD per million tokens"
  no_price: "No price for this model in this engine, so tokens are counted and no figure is invented."
  context: "Sent every turn"
  context_value: "{count} characters of skill and reference files, before a word of yours."
  context_truncation: "A runtime whose context window is smaller than this cuts it to fit and answers anyway, fluently, with part of the skill missing. Nothing in the reply says so. On Ollama the fix is OLLAMA_CONTEXT_LENGTH, and docs/smoke.md has the measurement."
  estimate: "Before you start"
  estimate_value: "roughly {low} to {high} USD"
  estimate_hint: "An order of magnitude, not a quote: the block above, sent again on each of four to six turns, counted at {ratio} characters per token, which is what one runtime measured, at the input rate. What you type and what comes back are on top, and are small next to the block."
  tokens: "{input} tokens in, {output} out"
  spent: "{amount} USD"
  refused_secrets_in_instance: "This instance holds credentials, and an instance is a directory people copy, sync and sometimes commit. Move these lines to your shell environment and delete them here, comments included."
  refused_credential_in_endpoint: "The endpoint carries a credential in the URL itself. Put it in the process environment instead."
  refused_endpoint_in_clear: "The instance points the key at an endpoint that is not encrypted. A file that travels between machines does not get to downgrade the transport carrying a credential."
  refused_endpoint_untrusted: "The instance points the key at an endpoint that is neither the provider's own nor a runtime on this machine. Export VERBATIM_BASE_URL yourself, or name the host in VERBATIM_ENDPOINT_OK, next to the key it is allowed to receive."
  refused_interviews_not_a_directory: "The interviews entry of this instance is not a directory, or cannot be created. An interview id addresses a directory inside the instance, and following a link out of one is how a discard leaves it."
  refused_env_unreadable: "The .env of this instance cannot be read. It was saved in another encoding, or its permissions changed. Nothing here is guessed at: fix the file, then reload this screen."
  refused_engine_refused: "The engine configuration for this instance was refused."
  bundle_broken: "A skill cites a file that is not in this bundle, so no step can be assembled. This is a bundle to repair, not a setting to change."
  error_bundle_broken: "A skill cites a file that is not in this bundle, so no step can be assembled. This is a bundle to repair, not a setting to change."
  error_engine_failed: "The turn stopped on a failure inside the engine."
  error_unknown: "The turn was refused, and this engine does not have a name for the reason."
  problem_provider_unknown: "Unknown provider: {detail}. This engine speaks two wires, anthropic for the native one and openai for anything speaking the OpenAI chat format, local inference included."
  problem_model_missing: "No model id. Set VERBATIM_MODEL, spelled exactly as the provider spells it."
  problem_endpoint_missing: "No endpoint. Set VERBATIM_BASE_URL, or pick a provider that has a default."
  problem_key_missing: "No API key in this process. Export ANTHROPIC_API_KEY, OPENAI_API_KEY or VERBATIM_API_KEY, next to the endpoint it is allowed to reach. An instance never holds a key."
  not_ready: "No model is configured, so no interview can start. Every other screen works."
  start: "Start an interview"
  open: "Interviews"
  no_open: "No interview yet."
  not_started: "nothing said yet"
  turns: "answers: {count}"
  unreadable: "the conversation file does not parse; the words are in transcript.md next to it"
  state_open: "open"
  state_closed: "closed"
  closed_notice: "This interview became {post}. It is kept as it was."
  awaiting: "The last thing you said never got its answer. The browser was closed, or the turn failed. Nothing is lost: ask for the reply again, or add to what you said and send."
  resume: "Ask for the reply again"
  your_turn: "Your answer"
  send: "Send"
  needs_js: "This screen streams an answer as it is written, which needs JavaScript. Every other screen works without it."
  bank: "The angle bank"
  bank_hint: "Your own lines, out of ideas.md. Clicking one puts it in the box; edit it before sending."
  ending: "Ending this interview"
  discard: "Discard this interview"
  discard_hint: "Removes interviews/{path} and everything in it. What you said goes with it."
  said: "You"
  asked: "Verbatim"
  thinking: "Waiting for the model."
  tool_call: "reads"
  tool_result: "answered"
  tool_failed: "refused"
  stop_truncated: "The stream stopped without the provider saying why. That is a cut answer, not the end of a turn."
  stop_max_tokens: "The reply hit its token ceiling. Ask again for the rest."
  stop_refusal: "The provider refused to answer. That is its own guardrail, not this engine's."
  stop_other: "The provider stopped for a reason this engine does not have a name for."
  stop_tool_use: "The provider stopped asking for a tool without the answer arriving."
  stop_unknown: "The provider stopped and gave the reason as {code}."
  sheet: "The validation sheet"
  sheet_hint: "Nothing is drafted until this sheet is approved. Every line of it must come from the interview, the profile or the corpus; approving it is saying that they do."
  sheet_angle: "Angle"
  sheet_elements: "Concrete elements"
  sheet_moment: "The strong moment"
  sheet_conviction: "Central conviction"
  sheet_first_lines: "First line"
  sheet_approve: "Approve this sheet"
  sheet_approve_hint: "Approving closes the questions. If something on it is wrong, do not approve: say what is wrong in the box, and the next proposal replaces this sheet."
  sheet_changed: "The sheet changed after this screen was drawn, so nothing was approved. What is below is the sheet as it stands now; read it again before deciding."
  sheet_approved_notice: "The sheet is approved. The interview asks no more questions, and the draft is written from what is here."
  sheet_closed_notice: "The sheet is approved, so the interview asks no more questions. Drafting is the next step."
  error_sheet_not_read: "This runtime was told to produce the sheet through its tool and did not, and what came back is not a sheet either. Nothing was written, and this is not something you did. It is the common way a small local model fails this step: it keeps interviewing instead. Ask again, or point the app at a stronger model."
  error_draft_not_read: "This runtime was told to write the post through its tool and did not, and what came back carries no anchors block, so it is the engine talking rather than a post. Nothing was written, and this is not something you did. Ask again, or point the app at a stronger model."
  sheet_problems: "How this sheet arrived"
  sheet_problems_hint: "This sheet was read out of an answer that ignored the tool it was asked for, so the engine parsed it out of free text. Read it more slowly than usual: what is below is what could not be read cleanly."
  sheet_ask: "Ask for the validation sheet"
  sheet_ask_hint: "When the interview has enough material, this asks the engine for the sheet, and requires it to produce one rather than to talk about it. You read it, then you decide."
  draft: "The draft"
  draft_write: "Write the post"
  draft_rewrite: "Write it again"
  draft_hint: "Written from the interview and the sheet you signed, every time. Nothing here is kept until you archive it."
  draft_written: "written {stamp}"
  draft_none: "No draft yet."
  error_sheet_not_approved: "The sheet is not approved, so there is nothing to draft from. Read it, then approve it."
  trace: "What backs this post"
  trace_hint: "Every claim of the post against the interview sentence behind it. Presence in the transcript is what a machine can check; whether it is true stays with you."
  trace_counts: "{anchored} anchored, {unanchored} unanchored, {fabricated} fabricated, {dangling} dangling"
  trace_none: "This post claims no source at all. Every sentence of it is unanchored."
  trace_clean: "Every claim of this post is backed by something you said."
  anchor_anchored: "anchored"
  anchor_fabricated: "fabricated"
  anchor_dangling: "dangling"
  anchor_unanchored: "unanchored"
  anchor_anchored_hint: "The quote is in the transcript, and the claim is in the post."
  anchor_fabricated_hint: "This quote is nowhere in what you said. The engine invented a source, which is worse than naming none."
  anchor_dangling_hint: "This fragment is not in the post, so it backs nothing in it."
  anchor_unanchored_hint: "Highlighted in the post: a claim no quote backs. Bare is honest, and it is yours to check."
  trace_problems: "What could not be read"
  trace_post: "In the post"
  trace_said: "You said"
  lint_run: "Run the style pass"
  lint_hint: "lib/lint.py, the same pass the engine runs. It reports, you decide."
  lint_findings: "Style pass"
  lint_failed: "The style pass did not run. Its own words follow, in English, because this one is the engine failing rather than a finding about your post."
  error_sheet_approved: "The sheet is approved, so the interview asks no more questions. Drafting is the next step."
  error_turn_running: "This interview already has a turn running. Wait for it, or reload the page."
  error_closed: "This interview is closed. It became a post, and what was said then is kept as it was."
  error_not_configured: "No model is configured any more. Check the interview screen."
  error_nothing_to_send: "There is nothing to send yet."
  error_gone: "This interview is not on disk any more."
  ceiling: "Stopped after {count} turns without an answer. The conversation is kept, nothing is lost."
  error: "The provider did not answer:"
  revision: "What to change"
  revision_hint: "Say what to change and rewrite. Every rewrite restarts from the interview and the sheet you signed, never from the draft on screen. What you type here is kept and counts as something you said, so a correction here is material the post may quote."
  revision_history: "What you asked for"
  revision_asked: "asked {stamp}"
  error_nothing_to_revise: "There is no draft to revise yet. The sheet you approved is what the first one is written to."
  notes: "What this session leaves beside the post"
  notes_hint: "Not the post and never published with it. Archiving files these under the post's session notes."
  photos: "Photo ideas"
  tips: "Tips"
  note_portrait: "Portrait"
  note_visual: "Visual"
  note_strong: "The strong message"
  note_weak: "The weak spot"
  note_lesson: "The lesson"
  note_missing: "not returned"
  format_counter_intuitive_number: "Counter-intuitive number"
  format_the_breakdown: "The breakdown"
  format_the_post_mortem: "The post-mortem"
  format_the_stance: "The stance"
  format_the_story: "The story"
  label_visibility: "Visibility"
  label_trust: "Trust"
  label_action: "Action"
  archive: "Archive this post"
  archive_hint: "A post that stays a draft is not finished. This writes the file under posts/, closes this interview on its name, and moves the angle it used into the used section of the bank. Nothing is sent anywhere."
  archive_date: "Publication date"
  archive_slug: "File name"
  archive_slug_hint: "Lower case, words joined by single dashes. The file is posts/<date>-<name>.md."
  archive_pillar: "Pillar"
  archive_format: "Format"
  archive_label: "Objective"
  archive_state: "State"
  archive_state_hint: "Draft until it is actually out. Every count in this system runs over published posts alone."
  archive_idea: "The angle this used"
  archive_idea_none: "none from the bank"
  archive_do: "Archive"
  archive_bad_slug: "That file name would not address a file under posts/. Lower case, digits and single dashes, nothing else."
  archive_bad_date: "That is not a date. Four digits, two, two, joined by dashes."
  archive_bad_pillar: "That is not one of the three pillars."
  archive_bad_format: "That is not one of the formats in references/formats.md."
  archive_bad_label: "That is not one of the three objective labels."
  archive_bad_state: "That is not one of the three states in references/measure.md."
  archive_no_draft: "There is no draft to archive."
  archive_already_closed: "This interview already became a post. Archiving again would file the same words twice, and both would be counted."
  archive_no_such_idea: "That angle is not in the bank any more. Reload this screen and pick again."
  archive_cannot_write: "This instance would not take the file. The post was not written and nothing was closed: repair the directory, then archive again."
  archive_closed_nothing: "The post was written to posts/ and this interview could not be closed on its name. Nothing is lost and nothing is duplicated: the file is there. Repair the interviews directory, then close it by hand or archive again under a different name."
  archive_name_taken: "A post already carries that name. Pick another one rather than writing over it: what loses is somebody's post."
  archive_signature_missing: "profile.md has no Signature block section, so nothing can be appended to this post. That is a section to restore, not a signature to do without."
  archive_instance_unreadable: "A file of this instance is there and its bytes will not come back as text. Nothing is guessed here: repair the file, then archive."
  idea_not_moved: "The post is filed and this interview is closed. The angle it used is still in the bank: move it into the used section by hand, so the bank stays honest."
