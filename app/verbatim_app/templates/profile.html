{% extends "base.html" %}
{% block title %}{{ t('profile.title') }} - {{ t('app.title') }}{% endblock %}
{% block content %}
<h1>{{ t('profile.title') }}</h1>
<p class="hint">{{ t('profile.hint') }}</p>
{% if saved %}<p class="flash">{{ t('profile.saved') }}</p>{% endif %}
<form method="post" action="/profile">
  <textarea name="content" rows="34" spellcheck="false">{{ text }}</textarea>
  <button type="submit">{{ t('profile.save') }}</button>
</form>
{% endblock %}
