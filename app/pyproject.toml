[project]
name = "verbatim-linkedin"
version = "2.0.0.dev0"
description = "Local web app over a Verbatim instance: LinkedIn posts built from an interview, never from thin air."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alexis Morain" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "pyyaml>=6",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
test = ["httpx>=0.27"]

[project.scripts]
verbatim = "verbatim_app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verbatim_app"]
